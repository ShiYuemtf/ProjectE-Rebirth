# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# Mod
projecte_version=1.0.1
minecraft_version=1.20.1
minecraft_version_range=>=1.20.1 <1.21
archives_base_name=projecte

# Fabric toolchain (https://fabricmc.net/develop/)
loom_version=1.10.5
# Dev environment loader only (does not change what players need; loader_version_range below is the published requirement).
# 0.16.3+ is what JEI 15.20.x declares, kept here so a local runClient against the optional JEI dependency is possible.
loader_version=0.20.1
loader_version_range=>=0.15.0
fabric_version=0.92.2+1.20.1

# Parchment (layered on top of Mojang official mappings)
parchment_minecraft_version=1.20.1
parchment_version=2023.09.03

junit_version=5.10.0

# Required library versions
permissions_api_version=0.2.5
commons_math_version=3.6.1

# Optional integrations (dev runtime only, all compileOnly at build time)
jei_version=15.20.0.106
# jei_version above is the Fabric coordinate (mezz.jei:jei-1.20.1-fabric); same build number as the Forge one upstream used.
jade_version=11.12.2
wthit_version=8.4.0
trinkets_version=3.7.2
cca_version=5.2.1
